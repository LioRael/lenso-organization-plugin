[workspace]
resolver = "2"
members = [
    "crates/lenso-capability-organization-admin",
    "crates/lenso-capability-organization-directory",
    "crates/lenso-capability-organization-membership",
    "crates/lenso-capability-organization-membership-admin",
    "crates/lenso-organization-secrets-fixture",
    "crates/lenso-organization-postgres-plugin",
    "crates/lenso-organization-agent-tools-plugin",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/LioRael/lenso-organization-plugin"
rust-version = "1.94"

[workspace.dependencies]
futures = "0.3"
getrandom = "0.4"
lenso = "0.5.0"
lenso-capability-agent-tool-provider = "0.1.0"
lenso-capability-secrets = { version = "0.1.2" }
lenso-contract-runtime = { version = "0.1.3" }
lenso-kernel = { version = "0.2.0" }
lenso-native-adapter = { version = "0.3.0" }
lenso-plugin-authoring = { version = "0.1.1" }
lenso-postgres-kit = { version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres"] }
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt"] }
zeroize = "1.8"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
